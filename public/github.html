<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12100e">
<title>GitHub · Strongroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/favicon-64.png">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main id="app">
  <div class="page-head">
    <div>
      <h1 class="page-title">GitHub puller</h1>
      <p class="sub">Paste a public repo. The first pull clones it, later pulls fast-forward it.</p>
    </div>
  </div>

  <div class="two">
    <section class="card">
      <div class="card-h"><span class="eyebrow">Pull a repository</span></div>
      <form id="pull-form" class="pull-form">
        <div>
          <input type="url" id="repo-url" placeholder="https://github.com/owner/repo" spellcheck="false" aria-label="Repository URL">
          <p class="error-line" id="pull-error"></p>
        </div>
        <button class="btn pri" type="submit" id="pull-btn" data-icon="download">Pull</button>
      </form>
      <div class="log-pane" id="log-pane" hidden aria-live="polite"></div>
    </section>

    <section class="card">
      <div class="card-h"><span class="eyebrow">On the server</span><small id="repo-count"></small></div>
      <div id="repo-list"></div>
      <div class="empty" id="repo-empty" hidden></div>
    </section>
  </div>
</main>

<script src="/assets/api.js"></script>
<script src="/assets/shell.js"></script>
<script src="/assets/github.js"></script>
</body>
</html>
