<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12100e">
<title>Sign in · Strongroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body class="login-body">
<main class="login-card">
  <div class="brand"><span class="brand-mark" data-icon="vault"></span>Strongroom</div>
  <h1>Welcome back</h1>
  <p class="sub">Your private file cloud. Sign in to continue.</p>
  <form id="login-form">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <p class="error-line" id="login-error" role="alert"></p>
    <button class="btn pri" type="submit" id="login-btn">Sign in</button>
  </form>
  <p class="login-foot" data-icon="lock">Accounts are made by an admin. There's no sign-up.</p>
</main>
<script src="/assets/api.js"></script>
<script src="/assets/login.js"></script>
</body>
</html>
