<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12100e">
<title>Settings · Strongroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/favicon-64.png">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main id="app">
  <div class="page-head">
    <div>
      <h1 class="page-title">Settings</h1>
      <p class="sub">Your account, storage and password.</p>
    </div>
  </div>

  <div class="two">
    <div class="stack">
      <section class="card">
        <div class="card-h"><span class="eyebrow">Storage</span></div>
        <div class="usage-big"><b id="usage-used">…</b><span id="usage-of"></span><span class="pct" id="usage-pct"></span></div>
        <div class="meter"><i id="usage-fill"></i></div>
        <p class="hint mt-sm">Counts everything in your web storage. Ask an admin if you need a bigger quota.</p>
      </section>

      <section class="card">
        <div class="card-h"><span class="eyebrow">Account</span></div>
        <dl class="kv" id="account-kv"></dl>
      </section>
    </div>

    <section class="card">
      <div class="card-h"><span class="eyebrow">Change password</span></div>
      <form id="password-form">
        <div class="field">
          <label for="pw-current">Current password</label>
          <input type="password" id="pw-current" autocomplete="current-password" required>
        </div>
        <div class="field">
          <label for="pw-next">New password</label>
          <input type="password" id="pw-next" autocomplete="new-password" required minlength="10">
          <p class="hint">At least 10 characters.</p>
        </div>
        <div class="field">
          <label for="pw-repeat">New password again</label>
          <input type="password" id="pw-repeat" autocomplete="new-password" required minlength="10">
        </div>
        <p class="error-line" id="pw-error"></p>
        <p class="ok-line" id="pw-ok"></p>
        <button class="btn pri" type="submit">Change password</button>
        <p class="hint mt">This signs you out on every other device. SFTP uses the new password straight away.</p>
      </form>
    </section>
  </div>
</main>

<script src="/assets/api.js"></script>
<script src="/assets/shell.js"></script>
<script src="/assets/settings.js"></script>
</body>
</html>
